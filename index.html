<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0f172a" />
<title>贪吃蛇</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="score">
        <div class="score-item">
          <span class="label">得分</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-item">
          <span class="label">最高</span>
          <span id="best" class="value">0</span>
        </div>
      </div>
      <button id="pauseBtn" class="icon-btn" aria-label="暂停">⏸</button>
    </header>

    <div class="board-wrap">
      <canvas id="game" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h1 id="overlayTitle">贪吃蛇</h1>
          <p id="overlayMsg">滑动屏幕或使用方向键控制</p>
          <button id="startBtn" class="primary-btn">开始游戏</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <button class="dbtn up" data-dir="up" aria-label="上">▲</button>
        <button class="dbtn left" data-dir="left" aria-label="左">◀</button>
        <button class="dbtn right" data-dir="right" aria-label="右">▶</button>
        <button class="dbtn down" data-dir="down" aria-label="下">▼</button>
      </div>
      <div class="side">
        <label class="speed">
          <span>速度</span>
          <input id="speed" type="range" min="1" max="5" value="3" />
        </label>
        <button id="restartBtn" class="ghost-btn">重新开始</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
